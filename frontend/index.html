<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced AI Visual Explainer</title>
    <style>
        :root {
            --bg-color: #06070a;
            --card-bg: rgba(13, 17, 28, 0.7);
            --accent-glow: #00f3ff;
            --accent-purple: #7000ff;
            --accent-danger: #ff3366;
            --text-main: #f0f4f8;
            --text-muted: #627288;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg-color); color: var(--text-main);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 3rem 2rem;
            background-image: radial-gradient(circle at 50% 0%, rgba(112, 0, 255, 0.12) 0%, transparent 60%);
        }

        header { text-align: center; margin-bottom: 3rem; max-width: 600px; }
        
        h1 {
            font-size: 2.4rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 0.5rem; text-transform: uppercase;
            background: linear-gradient(135deg, #fff 30%, var(--accent-glow) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        header p { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; letter-spacing: 0.5px; }

        .key-container {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 1rem; border-radius: 14px; width: 100%; max-width: 540px; margin-bottom: 3rem;
            backdrop-filter: blur(16px); box-shadow: 0 4px 30px rgba(0,0,0,0.4);
        }
        .key-container label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--text-muted); letter-spacing: 1px; }
        .key-container input {
            width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.8rem; border-radius: 8px; color: #fff; font-family: monospace; transition: all 0.3s ease;
        }
        .key-container input:focus { outline: none; border-color: var(--accent-glow); box-shadow: 0 0 15px rgba(0,243,255,0.15); }

        .workspace { display: grid; grid-template-columns: 1fr; gap: 3rem; width: 100%; max-width: 1200px; }
        @media (min-width: 850px) { .workspace { grid-template-columns: 1.1fr 0.9fr; } }

        .viewer-container { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; }

        .viewer-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 20px; padding: 2rem; min-height: 480px; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); width: 100%;
        }
        
        .upload-trigger {
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
            padding: 5rem 2rem; border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 14px; width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-align: center;
        }
        .upload-trigger:hover { border-color: var(--accent-glow); background: rgba(0, 243, 255, 0.01); }
        .upload-trigger span { font-weight: 700; color: #fff; margin-bottom: 0.4rem; letter-spacing: 0.5px; }
        .upload-trigger p { font-size: 0.85rem; color: var(--text-muted); }

        #image-container { position: relative; display: none; max-width: 100%; border-radius: 12px; overflow: hidden; }
        #display-image { display: block; max-width: 100%; height: auto; max-height: 65vh; transition: opacity 0.3s ease; }

        /* ALL DOTS REMOVED. NEW ULTRA-CLEAN SEAMLESS HOVER OVERLAY SYSTEM */
        .interactive-overlay-zone {
            position: absolute; border: 1px dashed rgba(0, 243, 255, 0.0); background: transparent;
            cursor: pointer; border-radius: 8px; transition: all 0.25s ease; z-index: 5;
        }
        
        /* THE X-RAY GLOW APPEARS ONLY WHEN YOUR CURSOR TOUCHES THE ZONE */
        .interactive-overlay-zone:hover, .interactive-overlay-zone.active {
            border: 2px solid var(--accent-glow);
            background: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 243, 255, 0.1);
            z-index: 10;
        }
        
        .box-label {
            background: var(--accent-glow); color: #000; font-size: 0.65rem; font-weight: 900;
            padding: 3px 8px; position: absolute; top: -22px; left: -2px; border-radius: 4px 4px 0 0; 
            white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0;
            transition: opacity 0.2s ease; pointer-events: none;
        }
        .interactive-overlay-zone:hover .box-label, .interactive-overlay-zone.active .box-label { opacity: 1; }

        .scanner-line {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(to right, transparent, var(--accent-glow), transparent);
            box-shadow: 0 0 20px var(--accent-glow); animation: scan 2s linear infinite; z-index: 15;
        }
        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        .reset-btn {
            display: none; background: rgba(255, 51, 102, 0.05); color: #ff557f;
            border: 1px solid rgba(255, 51, 102, 0.25); padding: 0.8rem 1.5rem; font-size: 0.85rem;
            font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-radius: 10px;
            cursor: pointer; width: 100%; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .reset-btn:hover {
            background: rgba(255, 51, 102, 0.15); border-color: var(--accent-danger);
            color: #fff; box-shadow: 0 0 20px rgba(255, 51, 102, 0.3); transform: translateY(-1px);
        }
        .reset-btn:active { transform: translateY(1px); }

        .panel-card { 
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.03); 
            border-radius: 20px; padding: 2rem; backdrop-filter: blur(16px);
            display: flex; flex-direction: column; max-height: 550px;
        }
        .panel-card h2 { font-size: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding-bottom: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        #feed-container { overflow-y: auto; flex-grow: 1; padding-right: 0.5rem; scroll-behavior: smooth; }
        #feed-container::-webkit-scrollbar { width: 4px; }
        #feed-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        
        .data-item { 
            padding: 1.25rem; background: rgba(255,255,255,0.01); border-left: 3px solid rgba(255, 255, 255, 0.05); 
            border-radius: 0 10px 10px 0; margin-bottom: 1rem; transition: all 0.25s ease;
        }
        .data-item:last-child { margin-bottom: 0; }
        .data-item:hover, .data-item.active { 
            background: rgba(0, 243, 255, 0.03); border-left-color: var(--accent-glow);
            box-shadow: -10px 0 20px rgba(0, 243, 255, 0.02);
        }
        .data-title { font-weight: 800; font-size: 1.05rem; color: #fff; margin-bottom: 0.4rem; letter-spacing: -0.2px; }
        .data-desc { font-size: 0.9rem; color: #8a99ad; line-height: 1.5; }
        
        .loading-text { font-size: 0.95rem; color: var(--accent-glow); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; text-align: center; padding: 2rem 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>AI X-RAY VISUAL EXPLAINER</h1>
        <p>Decoupled Client-Server Infrastructure Engine Model Setup</p>
    </header>

    <div class="key-container">
        <label for="api-key">Google AI Studio API Key Tokens</label>
        <input type="password" id="api-key" placeholder="Paste secure runtime key token here...">
    </div>

    <div class="workspace">
        <div class="viewer-container">
            <div class="viewer-card" id="viewer">
                <div class="scanner-line" id="scanner"></div>
                
                <div class="upload-trigger" id="drop-zone" onclick="document.getElementById('file-input').click()">
                    <span>Select Target Image Fragment</span>
                    <p>Click to open explorer window or drop files directly</p>
                    <input type="file" id="file-input" accept="image/*" class="hidden">
                </div>

                <div id="image-container">
                    <img id="display-image" src="" alt="Target Analysis Canvas">
                    <div id="box-overlay-layer"></div>
                </div>
            </div>
            
            <button class="reset-btn" id="reset-button" onclick="resetScanMatrix()">Delete & Reset Scan Matrix</button>
        </div>

        <div class="panel-card">
            <h2>System Diagnostic Output Feed</h2>
            <div id="feed-container">
                <p id="default-feed-text" style="color: var(--text-muted); font-style: italic; text-align: center; padding: 2rem 0;">Awaiting network data stream payload inputs...</p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const displayImage = document.getElementById('display-image');
        const imageContainer = document.getElementById('image-container');
        const boxOverlayLayer = document.getElementById('box-overlay-layer');
        const scanner = document.getElementById('scanner');
        const feedContainer = document.getElementById('feed-container');
        const apiKeyInput = document.getElementById('api-key');
        const resetButton = document.getElementById('reset-button');

        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length) { handleFile(this.files); }
        });

        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => { 
            e.preventDefault(); 
            if (e.dataTransfer.files && e.dataTransfer.files.length) { handleFile(e.dataTransfer.files); }
        });

         function handleFile(files) {
            // FIX: Explicitly extract the first single file item out of the list bundle
            const targetFile = files[0];
            
            const reader = new FileReader();
            reader.onload = function(e) {
                displayImage.src = e.target.result;
                dropZone.classList.add('hidden');
                imageContainer.style.display = 'block';
                resetButton.style.display = 'block'; 
                
                // Securely stream the unpacked binary data file object down the pipe
                uploadToBackendServer(targetFile);
            };
            reader.readAsDataURL(targetFile);
        }


        async function uploadToBackendServer(file) {
            const keyToken = apiKeyInput.value.trim();
            if (!keyToken) {
                alert("Runtime Exception: Client Key token headers are missing.");
                resetScanMatrix();
                return;
            }

            scanner.style.display = 'block';
            boxOverlayLayer.innerHTML = '';
            feedContainer.innerHTML = '<div class="loading-text">SCANNING TARGET ARTIFACT...</div>';
            displayImage.style.opacity = "0.3";

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch("http://localhost:8005/api/analyze", {
                    method: "POST",
                    headers: { "X-API-Key": keyToken },
                    body: formData
                });

                scanner.style.display = 'none';
                displayImage.style.opacity = "1";
                if (!response.ok) { const errData = await response.json(); throw new Error(errData.detail || "Server processing error."); }

                const dataNodes = await response.json();
                renderInteractiveNodes(dataNodes);

            } catch (err) {
                scanner.style.display = 'none';
                displayImage.style.opacity = "1";
                feedContainer.innerHTML = `<p style="color: #ff4d4d; text-align: center; padding: 2rem 0;">Network Exception: ${err.message}</p>`;
            }
        }

        function renderInteractiveNodes(nodes) {
            boxOverlayLayer.innerHTML = '';
            feedContainer.innerHTML = '';

            if (!Array.isArray(nodes) || nodes.length === 0) {
                feedContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">Parsing complete. Zero target tracking markers found.</p>';
                return;
            }

            nodes.forEach((node, index) => {
                const [ymin, xmin, ymax, xmax] = node.box;
                
                const top = (ymin / 10) + '%';
                const left = (xmin / 10) + '%';
                const height = ((ymax - ymin) / 10) + '%';
                const width = ((xmax - xmin) / 10) + '%';

                const box = document.createElement('div');
                box.className = 'interactive-overlay-zone';
                box.style.top = top; box.style.left = left; box.style.width = width; box.style.height = height;
                box.setAttribute('data-node-id', index);

                const label = document.createElement('span');
                label.className = 'box-label';
                label.innerText = node.name;
                box.appendChild(label);
                boxOverlayLayer.appendChild(box);

                const card = document.createElement('div');
                card.className = 'data-item';
                card.setAttribute('data-node-id', index);
                card.innerHTML = `<div class="data-title">${node.name}</div><div class="data-desc">${node.explanation}</div>`;
                feedContainer.appendChild(card);

                const highlight = (e) => {
                    document.querySelectorAll(`[data-node-id='${index}']`).forEach(el => el.classList.add('active'));
                    if (e.currentTarget === box) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                };
                
                const clear = () => {
                    document.querySelectorAll(`[data-node-id='${index}']`).forEach(el => el.classList.remove('active'));
                };
                
                box.addEventListener('mouseenter', highlight); box.addEventListener('mouseleave', clear);
                card.addEventListener('mouseenter', highlight); card.addEventListener('mouseleave', clear);
            });
        }

        function resetScanMatrix() {
            fileInput.value = ''; 
            displayImage.src = '';
            boxOverlayLayer.innerHTML = '';
            imageContainer.style.display = 'none';
            resetButton.style.display = 'none'; 
            scanner.style.display = 'none';
            displayImage.style.opacity = "1";
            
            dropZone.classList.remove('hidden');
            feedContainer.innerHTML = '<p style="color: var(--text-muted); font-style: italic; text-align: center; padding: 2rem 0;">Awaiting network data stream payload inputs...</p>';
        }
    </script>
</body>
</html>
